<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WebLinux</title>
  <style>
    :root{--accent:#e95420;--text:#f5f5f5;--panel:#262626;--muted:#aaa}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:system-ui,"Segoe UI",sans-serif;color:var(--text);background:#2c001e}button,input{font:inherit}button{border:0;border-radius:7px;padding:7px 11px;color:white;background:#444;cursor:pointer}button:hover{background:#555}#desktop{position:fixed;inset:0;background:linear-gradient(135deg,#77216f,#2c001e 55%,#e95420 140%)}#topbar{height:32px;padding:0 12px;background:#161616d9;display:flex;align-items:center;justify-content:space-between}#dock{position:absolute;left:8px;top:44px;bottom:12px;width:58px;border-radius:14px;background:#161616d9;display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 0}#dock button{width:44px;height:44px;font-size:24px;padding:0}.icon{position:absolute;right:24px;top:50px;width:90px;text-align:center;padding:8px;border-radius:8px;cursor:pointer}.icon:hover{background:#ffffff22}.icon span{display:block;font-size:38px}.window{position:absolute;width:620px;height:420px;left:calc(50% - 290px);top:calc(50% - 190px);border-radius:10px;overflow:hidden;background:#2b2b2b;box-shadow:0 14px 40px #000a}.titlebar{height:36px;padding:0 10px;background:#3a3a3a;display:flex;align-items:center;justify-content:space-between;cursor:move}.controls{display:flex;gap:7px}.controls b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#555;font-size:11px;cursor:pointer}.controls b:last-child:hover{background:var(--accent)}#terminal{height:calc(100% - 36px);background:#300a24;padding:10px;font:13px/1.4 ui-monospace,Consolas,monospace;overflow:auto;user-select:text}.line{white-space:pre-wrap;word-break:break-word}.prompt{display:flex}.prompt input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:white;font:inherit}.green{color:#8ae234}.blue{color:#729fcf}.yellow{color:#fce94f}.red{color:#ef2929}.muted{color:var(--muted)}#login{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#77216f,#1a0013)}.login-card{width:min(380px,calc(100% - 32px));padding:28px;border:1px solid #ffffff22;border-radius:18px;background:#17121de8;box-shadow:0 24px 80px #0009}.login-card h1{text-align:center;margin:6px 0}.login-card .logo{text-align:center;font-size:52px}.login-card label{display:block;margin:12px 0 5px}.login-card input{width:100%;border:1px solid #ffffff2a;border-radius8px;padding:11px;background:#100d13;color:white}.login-card input:focus{outline:2px solid #e9542055}.login-card button{width:100%;margin-top:18px;background:var(--accent);font-weight:bold}.error{min-height:18px;text-align:center;color:#ff8b8b;font-size:13px;margin-top:8px}
  </style>
</head>
<body>
<div id="desktop">
  <div id="topbar"><b>Activités</b><span id="clock"></span><span id="session">Compte</span></div>
  <div id="dock">
    <button title="Terminal" onclick="openTerminal()">🖥️</button>
    <button title="Fichiers" onclick="openFiles()">📁</button>
    <button title="À propos" onclick="openAbout()">🐧</button>
  </div>
  <div class="icon" ondblclick="openTerminal()"><span>🖥️</span>Terminal</div>
</div>
<div id="login">
  <form class="login-card" id="loginForm">
    <div class="logo">🐧</div><h1>WebLinux</h1>
    <label for="username">Utilisateur</label><input id="username" autocomplete="username" required>
    <label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required>
    <button>Se connecter</button><div class="error" id="loginError"></div>
  </form>
</div>
<script>
const $=q=>document.querySelector(q);
let accounts={user:{password:'user123',role:'user'},admin:{password:'admin123',role:'admin'}};
try{const saved=JSON.parse(localStorage.getItem('wl_accounts'));if(saved)accounts=saved}catch(e){}
let current=null,z=10,cwd='/home/user';
const save=()=>localStorage.setItem('wl_accounts',JSON.stringify(accounts));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));

$('#loginForm').onsubmit=e=>{e.preventEvent?.();e.preventDefault();const u=$('#username').value.trim(),p=$('#password').value;
  if(!accounts[u]||accounts[u].password!==p){$('#loginError').textContent='Identifiants incorrects';return}
  current={name:u,role:accounts[u].role};$('#login').style.display='none';$('#session').textContent=u+' ('+accounts[u].role+')';openTerminal();
};
function windowFrame(title,icon,content,w=620,h=420){const el=document.createElement('div');el.className='window';el.style.cssText=`width:${Math.min(w,innerWidth-20)}px;height:${Math.min(h,innerHeight-50)}px`;el.style.zIndex=++z;
 el.innerHTML=`<div class="titlebar"><b>${icon} ${esc(title)}</b><div class="controls"><b class="close">✕</b></div></div>`;el.append(content);document.body.append(el);$('.close',el).onclick=()=>el.remove();
 const bar=$('.titlebar',el);bar.onpointerdown=e=>{if(e.target.closest('.controls'))return;const sx=e.clientX-el.offsetLeft,sy=e.clientY-el.offsetTop;bar.setPointerCapture(e.pointerId);const mv=v=>{el.style.left=Math.max(0,Math.min(innerWidth-el.offsetWidth,v.clientX-sx))+'px';el.style.top=Math.max(32,Math.min(innerHeight-el.offsetHeight,v.clientY-sy))+'px'};bar.onpointermove=mv;bar.onpointerup=()=>bar.onpointermove=null};return el}
function openAbout(){const d=document.createElement('div');d.style.cssText='padding:20px';d.innerHTML='<h2>🐧 WebLinux 1.0</h2><p>Un mini système Linux fonctionnant entièrement dans le navigateur.</p>';windowFrame('À propos','🐧',d,420,250)}
function openFiles(){const d=document.createElement('div');d.style.cssText='padding:20px';d.innerHTML='<h3>📁 Fichiers</h3><p>/home/user</p><button>📄 projet.md</button> <button>📁 Bureau</button>';windowFrame('Fichiers','📁',d,560,340)}
function openTerminal(){const d=document.createElement('div');d.id='terminal';const history=[];let hi=0;
 d.innerHTML='<div class="line yellow">Bienvenue sur WebLinux 1.0 — tape help</div>';windowFrame('Terminal','🖥️',d,700,440);
 const append=(html)=>{const e=document.createElement('div');e.className='line';e.innerHTML=html;d.insertBefore(e,d.lastChild)};
 const prompt=()=>{const p=document.createElement('div');p.className='prompt';p.innerHTML=`<span class="green">${esc(current?.name||'user')}@weblinux</span>:<span class="blue">${cwd}</span>$ <input autocomplete="off">`;d.append(p);const input=p.querySelector('input');input.focus();input.onkeydown=e=>{if(e.key==='Enter'){const line=input.value;input.disabled=true;history.push(line);hi=history.length;run(line)}else if(e.key==='ArrowUp'&&hi>0){e.prevent;hi--;input.value=history[hi]}else if(e.key==='ArrowDown'){e.prevent;hi=Math.min(history.length,hi+1);input.value=hi<history.length?history[hi]:''}}};
 const print=s=>append(esc(s));
 function run(line){const [cmd,...args]=line.trim().split(/\s+/);if(!cmd){prompt();return}
  if(cmd==='help')append(`<span class="yellow">Commandes :</span> help ls pwd whoami date clear neofetch users <span class="green">useradd passwd</span> (sudo admin)`);
  else if(cmd==='ls')print('Bureau  Documents  Téléchargements  projet.md');
  else if(cmd==='pwd')print(cwd);else if(cmd==='whoami')print(current?.name||'user');
  else if(cmd==='date')print(new Date().toLocaleString('fr-FR'));else if(cmd==='clear'){d.innerHTML=''};
  else if(cmd==='neofetch')append(`<span class="yellow">.---.</span>\n |o_o |  WebLinux 1.0\n |:_/ |  ${esc(current?.name||'user')}@weblinux\n ___)  \n`);
  else if(cmd==='users')print(Object.keys(accounts).join('  '));
  else if(cmd==='sudo'){const sub=args[0];if(current?.role!=='admin')append('<span class="red">Permission refusée : compte admin requis.</span>');
   else if(sub==='useradd'){const name=args[1];if(!name||accounts[name])append('<span class="red">Nom absent ou utilisateur déjà existant.</span>');else {const pass=prompt('Mot de passe du nouvel utilisateur:');if(pass!==null){accounts[name]={password:pass||'changeme',role:'user'};save();print(`Utilisateur ${name} créé.`)}}}
   else if(sub==='passwd'){const name=args[1];if(!name||!accounts[name])append('<span class="red">Utilisateur introuvable.</span>');else {const pass=prompt('Nouveau mot de passe:');if(pass!==null){accounts[name].password=pass||accounts[name].password;save();print('Mot de passe modifié.')}}}
   else append('<span class="red">Usage : sudo useradd NOM | sudo passwd NOM</span>')}
  else if(cmd==='passwd'||cmd==='useradd')append('<span class="red">Permission refusée. Utilise sudo depuis le compte admin.</span>');
  else if(cmd==='exit')d.closest('.window')?.remove();else append(`<span class="red">bash: ${esc(cmd)}: commande introuvable</span>`);prompt();}
 prompt();d.onclick=e=>{if(!window.getSelection().toString())d.querySelector('.prompt:last-child input')?.focus()};
}
const tick=()=>$('#clock').textContent=new Date().toLocaleString('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});tick();setInterval(tick,10000);
</script>
</body>
</html>
