<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebLinux</title>
<style>
:root{--ac:#e95420;--bg1:#2c001e;--panel:rgba(20,20,20,.88);--win:#2b2b2b;--tb:#3a3a3a;--tx:#eee;--mut:#9a9a9a;--mono:ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000;color:var(--tx);font:14px system-ui,"Ubuntu","Segoe UI",sans-serif;user-select:none}
button{font:inherit;color:inherit;background:#444;border:0;border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{background:#555}
input,textarea{font:inherit;color:inherit}
#desktop{position:fixed;inset:0;background:linear-gradient(135deg,#77216f,#2c001e 55%,#e95420 140%);background-size:cover}
#top{position:fixed;top:0;left:0;right:0;height:32px;background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 10px;z-index:9000;backdrop-filter:blur(8px)}
#top .l,#top .r{display:flex;gap:12px;align-items:center;flex:1}
#top .r{justify-content:flex-end;position:relative}
#top .c{font-weight:600;cursor:default}
#top .act{cursor:pointer;padding:4px 10px;border-radius:12px;font-weight:600}
#top .act:hover{background:#ffffff22}
#pw{cursor:pointer;padding:4px 8px;border-radius:12px}#pw:hover{background:#ffffff22}
#dock{position:fixed;left:8px;top:44px;bottom:12px;width:58px;background:var(--panel);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;z-index:8000;backdrop-filter:blur(8px);overflow:auto;scrollbar-width:none}
#dock .it{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:24px;cursor:pointer;position:relative;flex:none}
#dock .it:hover{background:#ffffff26}
#dock .it.run::before{content:"";position:absolute;left:-7px;top:19px;width:5px;height:5px;border-radius:50%;background:var(--ac)}
#dock .sep{width:30px;height:1px;background:#ffffff33;flex:none;margin:3px 0}
#dock .it .tip{display:none;position:absolute;left:54px;background:#000d;padding:3px 8px;border-radius:6px;font-size:12px;white-space:nowrap;z-index:5}
#dock .it:hover .tip{display:block}
#icons{position:fixed;top:48px;right:16px;display:flex;flex-direction:column;gap:14px;z-index:1}
.dico{width:84px;text-align:center;cursor:pointer;padding:6px;border-radius:8px;font-size:12px;text-shadow:0 1px 3px #000}
.dico:hover{background:#ffffff22}.dico i{display:block;font-style:normal;font-size:38px}
.win{position:fixed;background:var(--win);border-radius:10px 10px 6px 6px;box-shadow:0 12px 40px #000a,0 0 0 1px #ffffff18;display:flex;flex-direction:column;min-width:260px;min-height:150px;resize:both;overflow:hidden}
.win.max{inset:32px 0 0 0!important;width:auto!important;height:auto!important;border-radius:0;resize:none}
.win .tb{height:36px;background:var(--tb);display:flex;align-items:center;justify-content:space-between;padding:0 10px;cursor:default;flex:none}
.win:not(.foc) .tb{background:#2f2f2f;color:var(--mut)}
.win .wb{display:flex;gap:8px}
.win .wb b{width:20px;height:20px;border-radius:50%;background:#555;display:grid;place-items:center;font-size:11px;cursor:pointer;font-weight:400}
.win .wb b:hover{background:#777}.win .wb .cls:hover{background:var(--ac)}
.win .bd{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.term{background:#300a24;font:13px/1.35 var(--mono);padding:8px;overflow:auto;flex:1;user-select:text;cursor:text}
.term pre{font:inherit;white-space:pre-wrap;word-break:break-all}
.term .pl{display:flex;gap:0;white-space:pre}.term .pl input{flex:1;background:none;border:0;outline:0;font:inherit;min-width:0}
.g{color:#8ae234;font-weight:700}.b{color:#729fcf;font-weight:700}.y{color:#fce94f}.r{color:#ef2929}.m{color:#ad7fa8}.c{color:#34e2e2}.d{color:#888}
.fbar{display:flex;gap:6px;padding:8px;background:#333;align-items:center;flex:none}
.fbar .path{flex:1;background:#222;border:1px solid #555;border-radius:6px;padding:4px 8px;outline:0;min-width:0;user-select:text}
.fgrid{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,92px);grid-auto-rows:92px;gap:6px;align-content:start}
.fi{text-align:center;padding:6px 2px;border-radius:8px;font-size:12px;cursor:pointer;word-break:break-all;overflow:hidden}
.fi i{display:block;font-style:normal;font-size:34px}.fi:hover{background:#ffffff14}.fi.sel{background:#e9542055}
.ed{flex:1;resize:none;border:0;outline:0;background:#1e1e1e;padding:10px;font:13px/1.5 var(--mono);tab-size:4;user-select:text;min-height:0}
.stat{padding:4px 10px;background:#333;font-size:12px;color:var(--mut);display:flex;justify-content:space-between;flex:none}
.pad{padding:16px;overflow:auto;flex:1;user-select:text}
.pad h3{margin:12px 0 8px}
table{border-collapse:collapse;width:100%}td,th{padding:4px 8px;text-align:left;border-bottom:1px solid #444;font-size:13px}
.wps{display:grid;grid-template-columns:repeat(auto-fill,110px);gap:10px}
.wp{height:70px;border-radius:8px;cursor:pointer;border:2px solid transparent}.wp.on{border-color:#fff}
#ctx{position:fixed;background:#333;border-radius:8px;padding:4px;z-index:9500;box-shadow:0 8px 24px #000a;display:none}
#ctx div{padding:6px 14px;border-radius:5px;cursor:pointer}#ctx div:hover{background:var(--ac)}
#launcher{position:fixed;inset:32px 0 0 0;background:#000c;z-index:8500;display:none;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
#launcher .grid{display:grid;grid-template-columns:repeat(3,110px);gap:20px}
#launcher .app{text-align:center;cursor:pointer;padding:10px;border-radius:10px}#launcher .app:hover{background:#ffffff22}#launcher .app i{display:block;font-style:normal;font-size:44px}
#modal{position:fixed;inset:0;background:#0008;z-index:9800;display:none;align-items:center;justify-content:center}
#modal .box{background:#333;padding:18px;border-radius:12px;min-width:300px;display:flex;flex-direction:column;gap:10px}
#modal input{background:#222;border:1px solid #666;border-radius:6px;padding:7px;outline:0}
#modal .bt{display:flex;gap:8px;justify-content:flex-end}
#boot,#off{position:fixed;inset:0;background:#000;z-index:9999;font:13px/1.5 var(--mono);color:#ccc;padding:24px;overflow:hidden}
#off{display:none;place-items:center;text-align:center;cursor:pointer;font:16px system-ui}
#menu{position:absolute;right:0;top:32px;background:#333;border-radius:8px;padding:4px;display:none;box-shadow:0 8px 24px #000a}
#menu div{padding:7px 18px;cursor:pointer;border-radius:5px}#menu div:hover{background:var(--ac)}
</style>
</head>
<body>
<div id="desktop"></div>
<div id="top">
  <div class="l"><span class="act" id="actBtn">Activités</span></div>
  <div class="c" id="clock"></div>
  <div class="r"><span title="Wi-Fi">📶</span><span title="Son">🔊</span><span title="Batterie" id="bat">🔋</span><span id="pw">⏻</span>
    <div id="menu"><div data-a="reboot">🔄 Redémarrer</div><div data-a="off">⏻ Éteindre</div></div></div>
</div>
<div id="dock"></div>
<div id="icons"></div>
<div id="launcher"><div class="grid"></div></div>
<div id="ctx"></div>
<div id="modal"><div class="box"><div id="mt"></div><input id="mi"><div class="bt"><button id="mc">Annuler</button><button id="mo" style="background:var(--ac)">OK</button></div></div></div>
<div id="off"><div><div style="font-size:60px">⏻</div><p style="margin-top:10px">Système éteint.<br>Clique pour redémarrer.</p></div></div>
<div id="boot"></div>

<script>
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let bootTime=Date.now();

/* ---------- Système de fichiers ---------- */
const D=c=>({t:'d',c:c||{}}), F=s=>({t:'f',s:s||''});
function defaultFS(){return D({
 home:D({user:D({
  Bureau:D(),Documents:D({'projet.md':F('# Mon projet\n\nBienvenue dans WebLinux !\n- [x] Ouvrir le terminal\n- [ ] Tout casser\n')}),
  Téléchargements:D(),Images:D(),
  'bonjour.txt':F('Salut ! Ce système tourne entièrement dans ton navigateur.\nEssaie : ls, cd, cat, mkdir, neofetch, tree, cowsay...\n'),
  '.bashrc':F('# ~/.bashrc\nalias ll="ls -l"\n')})}),
 etc:D({hostname:F('weblinux\n'),'os-release':F('NAME="WebLinux"\nVERSION="1.0 (Navigateur)"\nID=weblinux\nPRETTY_NAME="WebLinux 1.0"\n'),passwd:F('root:x:0:0:root:/root:/bin/bash\nuser:x:1000:1000:user:/home/user:/bin/bash\n')}),
 usr:D({bin:D(),lib:D()}),var:D({log:D({'syslog':F('Boot OK\nSystemd: tous les services sont démarrés\n')})}),
 tmp:D(),bin:D({ls:F('\x7fELF'),cat:F('\x7fELF'),bash:F('\x7fELF')}),root:D()});}
let fs=null;try{fs=JSON.parse(store.get('wlfs'))}catch(e){}
if(!fs||fs.t!=='d')fs=defaultFS();
const saveFS=()=>store.set('wlfs',JSON.stringify(fs));
const norm=(p,cwd)=>{if(p==='~'||p.startsWith('~/'))p='/home/user'+p.slice(1);const parts=p.startsWith('/')?[]:[...cwd];for(const s of p.split('/')){if(!s||s==='.')continue;if(s==='..')parts.pop();else parts.push(s)}return parts};
const get=parts=>{let n=fs;for(const s of parts){if(!n||n.t!=='d'||!Object.prototype.hasOwnProperty.call(n.c,s))return null;n=n.c[s]}return n};
const pstr=parts=>'/'+parts.join('/');
const short=parts=>{const s=pstr(parts);return s==='/home/user'?'~':s.startsWith('/home/user/')?'~'+s.slice(10):s};
const sortNames=n=>Object.keys(n.c).sort((a,b)=>(n.c[a].t===n.c[b].t?a.localeCompare(b,'fr'):n.c[a].t==='d'?-1:1));

/* ---------- Gestionnaire de fenêtres ---------- */
let zTop=100,wins=[];
function win(title,icon,body,o={}){
 const w=Math.min(o.w||640,innerWidth-20),h=Math.min(o.h||420,innerHeight-60);
 const el=document.createElement('div');el.className='win';
 el.style.cssText=`width:${w}px;height:${h}px;left:${o.x??Math.max(80,90+wins.length*28)}px;top:${o.y??Math.max(44,60+wins.length*28)}px`;
 el.innerHTML=`<div class="tb"><span class="ti"></span><span class="wb"><b class="min">–</b><b class="max">▢</b><b class="cls">✕</b></span></div><div class="bd"></div>`;
 $('.bd',el).appendChild(body);document.body.appendChild(el);
 const W={el,icon,title,hidden:false,onclose:o.onclose,
  setTitle(t){W.title=t;$('.ti',el).textContent=icon+' '+t;renderDock()},
  focus(){wins.forEach(x=>x.el.classList.remove('foc'));if(W.hidden){W.hidden=false;el.style.display='flex'}el.classList.add('foc');el.style.zIndex=++zTop;renderDock();o.onfocus&&o.onfocus()},
  close(){W.onclose&&W.onclose();el.remove();wins=wins.filter(x=>x!==W);renderDock()},
  hide(){W.hidden=true;el.style.display='none';el.classList.remove('foc');renderDock()}};
 W.setTitle(title);wins.push(W);
 el.addEventListener('pointerdown',()=>{if(!el.classList.contains('foc'))W.focus()});
 $('.cls',el).onclick=()=>W.close();$('.min',el).onclick=()=>W.hide();
 const mx=()=>el.classList.toggle('max');$('.max',el).onclick=mx;
 const tb=$('.tb',el);tb.ondblclick=e=>{if(!e.target.closest('.wb'))mx()};
 tb.addEventListener('pointerdown',e=>{if(e.target.closest('.wb')||el.classList.contains('max'))return;
  const sx=e.clientX-el.offsetLeft,sy=e.clientY-el.offsetTop;tb.setPointerCapture(e.pointerId);
  const mv=ev=>{el.style.left=Math.max(-el.offsetWidth+80,Math.min(innerWidth-80,ev.clientX-sx))+'px';el.style.top=Math.max(32,Math.min(innerHeight-40,ev.clientY-sy))+'px'};
  const up=()=>{tb.removeEventListener('pointermove',mv);tb.removeEventListener('pointerup',up)};
  tb.addEventListener('pointermove',mv);tb.addEventListener('pointerup',up)});
 W.focus();return W;
}

/* ---------- Dock / lanceur ---------- */
const APPS=[
 {id:'term',n:'Terminal',i:'🖥️',f:()=>openTerminal()},
 {id:'files',n:'Fichiers',i:'📁',f:()=>openFiles()},
 {id:'edit',n:'Éditeur de texte',i:'📝',f:()=>openEditor('/home/user/bonjour.txt')},
 {id:'mon',n:'Moniteur système',i:'📊',f:()=>openMonitor()},
 {id:'set',n:'Paramètres',i:'⚙️',f:()=>openSettings()},
 {id:'about',n:'À propos',i:'🐧',f:()=>openAbout()}];
function renderDock(){
 const d=$('#dock');d.innerHTML='';
 APPS.forEach(a=>{const e=document.createElement('div');e.className='it'+(wins.some(w=>w.icon===a.i)?' run':'');e.innerHTML=a.i+`<span class="tip">${a.n}</span>`;e.onclick=()=>a.f();d.appendChild(e)});
 if(wins.length){const s=document.createElement('div');s.className='sep';d.appendChild(s)}
 wins.forEach(w=>{const e=document.createElement('div');e.className='it'+(w.el.classList.contains('foc')?' run':'');e.innerHTML=w.icon+`<span class="tip">${esc(w.title)}</span>`;
  e.onclick=()=>{if(w.hidden||!w.el.classList.contains('foc'))w.focus();else w.hide()};d.appendChild(e)});
}
const L=$('#launcher');
$('#actBtn').onclick=()=>{L.style.display=L.style.display==='flex'?'none':'flex'};
$('.grid',L).innerHTML=APPS.map((a,i)=>`<div class="app" data-i="${i}"><i>${a.i}</i>${a.n}</div>`).join('');
L.onclick=e=>{const a=e.target.closest('.app');L.style.display='none';if(a)APPS[a.dataset.i].f()};

/* ---------- Modale ---------- */
function ask(title,def,cb){const m=$('#modal'),i=$('#mi');$('#mt').textContent=title;i.value=def||'';m.style.display='flex';i.focus();i.select();
 const done=v=>{m.style.display='none';$('#mo').onclick=$('#mc').onclick=i.onkeydown=null;if(v!=null&&v!=='')cb(v)};
 $('#mo').onclick=()=>done(i.value);$('#mc').onclick=()=>done(null);i.onkeydown=e=>{if(e.key==='Enter')done(i.value);if(e.key==='Escape')done(null)}}

/* ---------- Ouvrir un chemin ---------- */
function openPath(parts){const n=get(parts);if(!n)return;n.t==='d'?openFiles(parts):openEditor(pstr(parts))}

/* ---------- Gestionnaire de fichiers ---------- */
function openFiles(start){
 let cwd=start?[...start]:['home','user'],sel=null;
 const body=document.createElement('div');body.style.cssText='display:flex;flex-direction:column;flex:1;min-height:0';
 body.innerHTML=`<div class="fbar"><button data-a="up" title="Dossier parent">⬆</button><button data-a="home" title="Dossier personnel">🏠</button><input class="path"><button data-a="nf">+ Fichier</button><button data-a="nd">+ Dossier</button><button data-a="del">🗑 Supprimer</button></div><div class="fgrid"></div><div class="stat"><span class="cnt"></span><span>Double-clic pour ouvrir</span></div>`;
 const W=win('Fichiers','📁',body,{w:660,h:440});
 const grid=$('.fgrid',body),path=$('.path',body);
 function draw(){const n=get(cwd);if(!n||n.t!=='d'){cwd=['home','user'];return draw()}
  path.value=pstr(cwd);W.setTitle(cwd.length?cwd[cwd.length-1]:'/');sel=null;
  const names=sortNames(n);$('.cnt',body).textContent=names.length+' élément(s)';
  grid.innerHTML=names.map(k=>`<div class="fi" data-n="${esc(k)}"><i>${n.c[k].t==='d'?'📁':/\.(png|jpe?g|gif)$/i.test(k)?'🖼️':'📄'}</i>${esc(k)}</div>`).join('')||'<div style="color:#888;grid-column:1/-1">Dossier vide</div>'}
 grid.onclick=e=>{const f=e.target.closest('.fi');grid.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));if(f){f.classList.add('sel');sel=f.dataset.n}else sel=null};
 grid.ondblclick=e=>{const f=e.target.closest('.fi');if(!f)return;const p=[...cwd,f.dataset.n];if(get(p).t==='d'){cwd=p;draw()}else openPath(p)};
 path.onkeydown=e=>{if(e.key==='Enter'){const p=norm(path.value,cwd),n=get(p);if(n&&n.t==='d'){cwd=p;draw()}else path.value=pstr(cwd)}};
 body.onclick=e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
  if(a==='up'){cwd.pop();draw()}else if(a==='home'){cwd=['home','user'];draw()}
  else if(a==='nf')ask('Nom du nouveau fichier','nouveau.txt',v=>{const n=get(cwd);if(!/[\/]/.test(v)&&!n.c[v]){n.c[v]=F();saveFS();draw()}});
  else if(a==='nd')ask('Nom du nouveau dossier','Nouveau dossier',v=>{const n=get(cwd);if(!/[\/]/.test(v)&&!n.c[v]){n.c[v]=D();saveFS();draw()}});
  else if(a==='del'&&sel){delete get(cwd).c[sel];saveFS();draw()}};
 draw();return W;
}

/* ---------- Éditeur ---------- */
function openEditor(p){
 const parts=norm(p,[]),node=get(parts);
 const body=document.createElement('div');body.style.cssText='display:flex;flex-direction:column;flex:1;min-height:0';
 body.innerHTML=`<div class="fbar"><input class="path"><button class="sv" style="background:var(--ac)">💾 Enregistrer</button></div><textarea class="ed" spellcheck="false"></textarea><div class="stat"><span class="st">Prêt</span><span class="ln"></span></div>`;
 const ta=$('.ed',body),pi=$('.path',body),st=$('.st',body);
 ta.value=node&&node.t==='f'?node.s:'';pi.value=pstr(parts);
 const info=()=>{$('.ln',body).textContent=ta.value.split('\n').length+' lignes · '+ta.value.length+' car.'};info();
 const W=win(parts[parts.length-1]||'Sans titre','📝',body,{w:600,h:420});
 const save=()=>{const np=norm(pi.value,['home','user']),par=get(np.slice(0,-1)),nm=np[np.length-1];
  if(!nm||!par||par.t!=='d'){st.textContent='❌ Chemin invalide';return}
  if(par.c[nm]&&par.c[nm].t==='d'){st.textContent='❌ C\'est un dossier';return}
  par.c[nm]=F(ta.value);saveFS();st.textContent='✅ Enregistré à '+new Date().toLocaleTimeString('fr-FR');W.setTitle(nm)};
 $('.sv',body).onclick=save;ta.oninput=()=>{info();st.textContent='Modifié…'};
 ta.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save()}
  if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart;ta.setRangeText('\t',s,ta.selectionEnd,'end')}};
 setTimeout(()=>ta.focus(),50);return W;
}

/* ---------- Moniteur système ---------- */
function openMonitor(){
 const body=document.createElement('div');body.className='pad';
 body.innerHTML=`<canvas width="600" height="140" style="width:100%;height:140px;background:#1b1b1b;border-radius:8px"></canvas><p class="inf" style="margin:10px 0;color:#bbb"></p><h3>Processus</h3><table><thead><tr><th>PID</th><th>Nom</th><th>CPU</th><th>Mém</th></tr></thead><tbody></tbody></table>`;
 const cv=$('canvas',body),cx=cv.getContext('2d');let data=Array(60).fill(10),v=15;
 const tick=()=>{v=Math.max(2,Math.min(95,v+(Math.random()-.48)*14));data.push(v);data.shift();
  cx.clearRect(0,0,600,140);cx.strokeStyle='#333';for(let y=0;y<=140;y+=35){cx.beginPath();cx.moveTo(0,y);cx.lineTo(600,y);cx.stroke()}
  cx.beginPath();data.forEach((d,i)=>cx[i?'lineTo':'moveTo'](i*10,140-d*1.4));cx.strokeStyle='#e95420';cx.lineWidth=2;cx.stroke();
  cx.lineTo(590,140);cx.lineTo(0,140);cx.fillStyle='#e9542030';cx.fill();
  const mem=navigator.deviceMemory?navigator.deviceMemory+' Go':'n/d',up=Math.floor((Date.now()-bootTime)/1000);
  $('.inf',body).innerHTML=`CPU : <b>${v.toFixed(0)}%</b> · Cœurs : <b>${navigator.hardwareConcurrency||'?'}</b> · RAM : <b>${mem}</b> · Uptime : <b>${Math.floor(up/60)}m ${up%60}s</b>`;
  const rows=[[1,'systemd'],[2,'kthreadd'],[88,'weblinux-wm'],...wins.map((w,i)=>[1000+i,w.title])];
  $('tbody',body).innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td>${(Math.random()*(r[0]>999?6:1)).toFixed(1)}%</td><td>${(8+Math.random()*30).toFixed(0)} Mo</td></tr>`).join('')};
 tick();const iv=setInterval(tick,1000);
 return win('Moniteur système','📊',body,{w:640,h:480,onclose:()=>clearInterval(iv)});
}

/* ---------- Paramètres ---------- */
const WPS=['linear-gradient(135deg,#77216f,#2c001e 55%,#e95420 140%)','linear-gradient(160deg,#0f2027,#203a43,#2c5364)','linear-gradient(135deg,#232526,#414345)','linear-gradient(135deg,#134e5e,#71b280)','linear-gradient(135deg,#42275a,#734b6d)','radial-gradient(circle at 30% 20%,#3a1c71,#d76d77 60%,#ffaf7b)','linear-gradient(135deg,#000428,#004e92)','#1a1a1a'];
function setWP(i){$('#desktop').style.background=WPS[i];$('#desktop').style.backgroundSize='cover';store.set('wlwp',i)}
function openSettings(){
 const body=document.createElement('div');body.className='pad';

   else if(!p.length||(p.length<=cwd.length&&p.every((s,i)=>s===cwd[i])&&n.t==='d'))x.o(err(`rm : opération refusée sur '${f}'`));else delete par.c[nm]});saveFS()},

   const I=[`<span class="g">user</span>@<span class="g">weblinux</span>`,'-----------------',`<span class="g">OS</span>: WebLinux 1.0 x86_64`,`<span class="g">Noyau</span>: 6.8.0-web`,`<span class="g">Uptime</span>: ${up} min`,`<span class="g">Shell</span>: bash 5.2`,`<span class="g">Résolution</span>: ${innerWidth}x${innerHeight}`,`<span class="g">CPU</span>: ${navigator.hardwareConcurrency||'?'} cœurs`,`<span class="g">Terminal</span>: weblinux-term`];
   for(let i=0;i<Math.max(L.length,I.length);i++)x.o((L[i]||'             ')+'  '+(I[i]||''))},

  fortune(a,x){const f=['Il n\'y a pas de nuage, juste l\'ordinateur de quelqu\'un d\'autre.','sudo make me a sandwich.','Il y a 10 types de personnes : celles qui comprennent le binaire et les autres.','Ça marche sur ma machine.','rm -rf n\'est pas une stratégie de sauvegarde.'];x.o(f[Math.random()*f.length|0])},
  grep(a,x){const args=a.filter(s=>s[0]!=='-'),ic=a.some(s=>/^-.*i/.test(s)),pat=args[0];if(!pat)return x.o(err('Usage : grep MOTIF [FICHIER]'));
   let re;try{re=new RegExp(pat,ic?'i':'')}catch(e){return x.o(err('motif invalide'))}
   let src=x.in;if(args[1]){const n=get(norm(args[1],cwd));if(!n||n.t!=='f')return x.o(err(`grep : ${args[1]} : introuvable`));src=n.s}
   if(src==null)return;lines(src).filter(l=>re.test(l)).forEach(l=>x.o(esc(l)))},
  wc(a,x){let s=x.in;if(a[0]){const n=get(norm(a[0],cwd));if(!n||n.t!=='f')return x.o(err('wc : fichier introuvable'));s=n.s}if(s==null)return;
   x.o(`${s?s.replace(/\n$/,'').split('\n').length:0} ${s.trim()?s.trim().split(/\s+/).length:0} ${s.length}`)},
  head(a,x){C._ht(a,x,true)},tail(a,x){C._ht(a,x,false)},
  _ht(a,x,h){let n=10,f=null;for(let i=0;i<a.length;i++){if(a[i]==='-n')n=+a[++i]||10;else if(/^-\d+$/.test(a[i]))n=+a[i].slice(1);else f=a[i]}
   let s=x.in;if(f){const nd=get(norm(f,cwd));if(!nd||nd.t!=='f')return x.o(err('fichier introuvable'));s=nd.s}if(s==null)return;
   const l=lines(s);(h?l.slice(0,n):l.slice(-n)).forEach(z=>x.o(esc(z)))},
  sort(a,x){let s=x.in;if(a[0]){const n=get(norm(a[0],cwd));if(!n||n.t!=='f')return x.o(err('fichier introuvable'));s=n.s}if(s==null)return;
   const l=lines(s).sort((p,q)=>p.localeCompare(q,'fr'));(a.includes('-r')?l.reverse():l).forEach(z=>x.o(esc(z)))},

 function exec(seg,input,last){
  let buf=[],red=null;seg=seg.trim();
  const m=seg.match(/^(.*?)\s*(>>|>)\s*(\S+)\s*$/);if(m&&last){seg=m[1];red={app:m[2]==='>>',f:m[3]}}
  const a=split(expand(seg));if(!a.length)return '';
  const name=a.shift(),x={in:input,o:h=>buf.push(h)};
  if(C[name]&&name[0]!=='_')C[name](a,x);else x.o(err(`bash : ${name} : commande introuvable (essaie 'help')`));
  if(red){const t=plain(buf.join('\n')),p=norm(red.f,cwd),par=get(p.slice(0,-1)),nm=p[p.length-1];
   if(!par||par.t!=='d'||(par.c[nm]&&par.c[nm].t==='d'))print(err(`bash : ${red.f} : impossible d'écrire`));
   else{par.c[nm]=F((red.app&&par.c[nm]?par.c[nm].s:'')+t+'\n');saveFS()}return ''}
  return buf.join('\n');
 }
 function run(line){
  print(promptHTML()+esc(line));if(!line.trim())return;
  hist.push(line);hi=hist.length;
  const segs=line.split('|');let input=null,res='';
  segs.forEach((s,i)=>{res=exec(s,input,i===segs.length-1);input=plain(res)});
  if(res)print(res);setPrompt();
 }
 function complete(){
  const v=inp.value,parts=v.split(' '),w=parts[parts.length-1];let cands=[];
  if(parts.length===1)cands=CMDS.filter(c=>c.startsWith(w));
  else{const i=w.lastIndexOf('/'),dir=i>=0?w.slice(0,i+1):'',base=w.slice(i+1),n=get(norm(dir||'.',cwd));
   if(n&&n.t==='d')cands=Object.keys(n.c).filter(k=>k.startsWith(base)).map(k=>dir+k+(n.c[k].t==='d'?'/':''))}
  if(cands.length===1){parts[parts.length-1]=cands[0];inp.value=parts.join(' ')+(cands[0].endsWith('/')?'':' ')}
  else if(cands.length>1){print(promptHTML()+esc(v));print(cands.map(esc).join('  '));let p=cands[0];for(const c of cands)while(!c.startsWith(p))p=p.slice(0,-1);parts[parts.length-1]=p;inp.value=parts.join(' ')}
 }
 inp.onkeydown=e=>{
  if(e.key==='Enter'){const l=inp.value;inp.value='';run(l);scroll()}
  else if(e.key==='ArrowUp'){e.preventDefault();if(hi>0)inp.value=hist[--hi]}
  else if(e.key==='ArrowDown'){e.preventDefault();inp.value=hi<hist.length-1?hist[++hi]:(hi=hist.length,'')}
  else if(e.key==='Tab'){e.preventDefault();complete();scroll()}
  else if(e.ctrlKey&&e.key==='l'){e.preventDefault();out.innerHTML=''}
  else if(e.ctrlKey&&e.key==='c'){e.preventDefault();print(promptHTML()+esc(inp.value)+'^C');inp.value=''}
 };
 term.onclick=()=>{if(!getSelection().toString())inp.focus()};
 W.el.addEventListener('pointerdown',()=>setTimeout(()=>{if(!getSelection().toString())inp.focus()},0));
 setPrompt();
 print(`<span class="y">Bienvenue sur WebLinux 1.0</span> (navigateur x86_64)\nTape <span class="c">help</span> pour voir les commandes, ou <span class="c">neofetch</span> pour faire le beau.\n`);

}

function poweroff(){wins.slice().forEach(w=>w.close());$('#off').style.display='grid'}
$('#off').onclick=()=>{$('#off').style.display='none';boot()};
function boot(){
 wins.slice().forEach(w=>w.close());bootTime=Date.now();
 const b=$('#boot');b.style.display='block';b.style.opacity=1;b.style.transition='';b.innerHTML='';
 const L=['[  <span style="color:#8ae234">OK</span>  ] Démarrage du noyau Linux 6.8.0-web','[  <span style="color:#8ae234">OK</span>  ] Monté le système de fichiers racine','[  <span style="color:#8ae234">OK</span>  ] Démarré systemd-journald','[  <span style="color:#8ae234">OK</span>  ] Atteint la cible Réseau','[  <span style="color:#8ae234">OK</span>  ] Démarré le gestionnaire d\'affichage','[  <span style="color:#8ae234">OK</span>  ] Atteint la cible Interface graphique','','WebLinux 1.0 — bienvenue, user !'];
 let i=0,done=false;
 const fin=()=>{if(done)return;done=true;b.style.transition='opacity .5s';b.style.opacity=0;setTimeout(()=>{b.style.display='none';openTerminal()},500)};
 const step=()=>{if(done)return;if(i<L.length){b.innerHTML+=L[i++]+'\n';b.style.whiteSpace='pre';setTimeout(step,170)}else setTimeout(fin,350)};
 b.onclick=fin;step();
}
renderDock();boot();
