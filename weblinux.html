<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebLinux</title>
<style>
:root{--ac:#e95420;--panel:rgba(20,20,24,.8);--win:#2a2a2e;--tb:#3a3a40;--tbi:#2e2e33;--tx:#f2f2f4;--mut:#a3a3ad;--in:#1c1c20;--bd:#ffffff1f;--hov:#ffffff20;--btn:#47474e;--btnh:#58585f;--mono:ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace}
:root[data-theme=light]{--panel:rgba(246,246,248,.84);--win:#fbfbfc;--tb:#e9e9ed;--tbi:#f2f2f4;--tx:#1d1d1f;--mut:#66666e;--in:#fff;--bd:#0000001f;--hov:#00000014;--btn:#e1e1e6;--btnh:#d2d2d8}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000;color:var(--tx);font:14px system-ui,"Ubuntu","Segoe UI",sans-serif;user-select:none}
button{font:inherit;color:inherit;background:var(--btn);border:0;border-radius:8px;padding:6px 12px;cursor:pointer;transition:background .15s,filter .15s}
button:hover{background:var(--btnh)}button.pri{background:var(--ac);color:#fff}button.pri:hover{filter:brightness(1.1)}button.dan{background:#c01c28;color:#fff}
input,textarea{font:inherit;color:inherit}
input[type=text],input[type=password],input:not([type]){background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;outline:0}
input:focus{border-color:var(--ac)}
input[type=range]{accent-color:var(--ac);width:100%}
#desktop{position:fixed;inset:0;background:linear-gradient(135deg,#77216f,#2c001e 55%,#e95420 140%);background-size:cover;transition:background .4s}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9950}
body.out #dock,body.out #icons,body.out #top{display:none}
#top{position:fixed;top:0;left:0;right:0;height:32px;background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 10px;z-index:9000;backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--bd)}
#top .l,#top .r{display:flex;gap:12px;align-items:center;flex:1}
#top .r{justify-content:flex-end;cursor:pointer}#top .r span{padding:2px 3px}
#top .c{font-weight:600;cursor:default}
#top .act{cursor:pointer;padding:4px 12px;border-radius:14px;font-weight:600}#top .act:hover{background:var(--hov)}
#appname{color:var(--mut);font-size:13px;max-width:30vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#usr{background:var(--hov);border-radius:12px;padding:2px 10px!important;font-weight:600}
#dock{position:fixed;left:10px;top:46px;bottom:14px;width:60px;background:var(--panel);border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;z-index:8000;backdrop-filter:blur(14px);overflow:auto;scrollbar-width:none;box-shadow:0 8px 30px #0006,0 0 0 1px var(--bd)}
#dock .it{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:25px;cursor:pointer;position:relative;flex:none;transition:transform .15s,background .15s}
#dock .it:hover{background:var(--hov);transform:scale(1.1)}
#dock .it.run::before{content:"";position:absolute;left:-7px;top:20px;width:5px;height:5px;border-radius:50%;background:var(--ac)}
#dock .sep{width:30px;height:1px;background:var(--bd);flex:none;margin:3px 0}
#dock .it .tip{display:none;position:absolute;left:58px;background:#000d;color:#fff;padding:4px 9px;border-radius:7px;font-size:12px;white-space:nowrap;z-index:5}
#dock .it:hover .tip{display:block}
#icons{position:fixed;top:48px;right:16px;display:flex;flex-direction:column;gap:14px;z-index:1}
.dico{width:88px;text-align:center;cursor:pointer;padding:6px;border-radius:10px;font-size:12px;color:#fff;text-shadow:0 1px 4px #000}
.dico:hover{background:#ffffff22}.dico i{display:block;font-style:normal;font-size:40px}
.win{position:fixed;background:var(--win);border-radius:12px 12px 8px 8px;box-shadow:0 14px 44px #0009,0 0 0 1px var(--bd);display:flex;flex-direction:column;min-width:270px;min-height:160px;resize:both;overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.win.max{inset:32px 0 0 0!important;width:auto!important;height:auto!important;border-radius:0;resize:none}
.win .tb{height:38px;background:var(--tb);display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 14px;cursor:default;flex:none;font-weight:600}
.win:not(.foc) .tb{background:var(--tbi);color:var(--mut)}
.win .wb{display:flex;gap:8px}
.win .wb b{width:22px;height:22px;border-radius:50%;background:var(--hov);display:grid;place-items:center;font-size:11px;cursor:pointer;font-weight:400}
.win .wb b:hover{background:var(--btnh)}.win .wb .cls:hover{background:#c01c28;color:#fff}
.win .bd{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.term{background:#2a0a22;color:#eee;font:13px/1.4 var(--mono);padding:10px;overflow:auto;flex:1;user-select:text;cursor:text}
.term pre{font:inherit;white-space:pre-wrap;word-break:break-all}
.term .pl{display:flex;white-space:pre}.term .pl input{flex:1;background:none;border:0;outline:0;font:inherit;min-width:0;color:#eee;padding:0;border-radius:0}
.g{color:#8ae234;font-weight:700}.b{color:#729fcf;font-weight:700}.y{color:#fce94f}.r{color:#ef2929}.m{color:#ad7fa8}.c{color:#34e2e2}.d{color:#888}
.fbar{display:flex;gap:6px;padding:8px;background:var(--tbi);align-items:center;flex:none;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
.fbar .path{flex:1;min-width:120px;user-select:text}
.fmain{flex:1;display:flex;min-height:0}
.side{width:160px;background:var(--tbi);padding:8px;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:none;border-right:1px solid var(--bd)}
.side div{padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap}.side div:hover{background:var(--hov)}.side div.on{background:var(--ac);color:#fff}
.fgrid{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,94px);grid-auto-rows:94px;gap:6px;align-content:start}
.fi{text-align:center;padding:6px 2px;border-radius:10px;font-size:12px;cursor:pointer;word-break:break-all;overflow:hidden}
.fi i{display:block;font-style:normal;font-size:34px}.fi:hover{background:var(--hov)}.fi.sel{background:color-mix(in srgb,var(--ac) 35%,transparent)}
.ed{flex:1;resize:none;border:0;outline:0;background:var(--in);padding:12px;font:13px/1.55 var(--mono);tab-size:4;user-select:text;min-height:0}
.stat{padding:5px 12px;background:var(--tbi);font-size:12px;color:var(--mut);display:flex;justify-content:space-between;flex:none;border-top:1px solid var(--bd)}
.pad{padding:16px;overflow:auto;flex:1;user-select:text}
.pad h3{margin:14px 0 8px}.pad h3:first-child{margin-top:0}
.tabs{display:flex;gap:4px;padding:8px 10px 0;background:var(--tbi);flex:none;border-bottom:1px solid var(--bd);overflow:auto}
.tab{padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;color:var(--mut)}.tab:hover{color:var(--tx)}.tab.on{background:var(--win);color:var(--tx);font-weight:600;box-shadow:inset 0 -2px var(--ac)}
.tbl{border-collapse:collapse;width:100%}.tbl td,.tbl th{padding:7px 8px;text-align:left;border-bottom:1px solid var(--bd);font-size:13px}.tbl th{color:var(--mut);font-weight:600}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--hov)}.badge.adm{background:var(--ac);color:#fff}
.logbox{background:#111;color:#cfc;font:12px/1.5 var(--mono);padding:10px;border-radius:8px;white-space:pre-wrap;word-break:break-all;max-height:100%;user-select:text}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.svc{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;background:var(--tbi);margin-bottom:6px}
.wps{display:grid;grid-template-columns:repeat(auto-fill,100px);gap:10px}
.wp{height:64px;border-radius:10px;cursor:pointer;border:2px solid transparent}.wp.on{border-color:var(--tx)}
.acs{display:flex;gap:10px}.acs i{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent}.acs i.on{border-color:var(--tx)}
.calc{display:flex;flex-direction:column;flex:1;padding:10px;gap:8px;background:var(--win)}
.calc .scr{background:var(--in);border-radius:10px;padding:10px 14px;text-align:right;min-height:78px}.calc .scr small{color:var(--mut);display:block;height:18px}.calc .scr div{font-size:32px;font-weight:600;overflow:hidden}
.calc .keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.calc .keys button{font-size:18px;padding:0}.calc .keys .op{background:var(--ac);color:#fff}
#ctx{position:fixed;background:var(--panel);backdrop-filter:blur(14px);border-radius:10px;padding:5px;z-index:9500;box-shadow:0 8px 28px #0008,0 0 0 1px var(--bd);display:none}
#ctx div{padding:7px 16px;border-radius:6px;cursor:pointer}#ctx div:hover{background:var(--ac);color:#fff}
#launcher{position:fixed;inset:32px 0 0 0;background:#000b;z-index:8500;display:none;align-items:center;justify-content:center;backdrop-filter:blur(14px)}
#launcher .lw{display:flex;flex-direction:column;gap:24px;align-items:center;color:#fff}
#launcher input{width:320px;background:#ffffff22;border:1px solid #ffffff33;color:#fff;text-align:center;border-radius:20px}
#launcher .grid{display:grid;grid-template-columns:repeat(4,110px);gap:18px}
#launcher .app{text-align:center;cursor:pointer;padding:12px 6px;border-radius:12px;font-size:13px}#launcher .app:hover{background:#ffffff22}#launcher .app i{display:block;font-style:normal;font-size:44px}
#qs{position:fixed;top:38px;right:8px;width:300px;background:var(--panel);backdrop-filter:blur(18px);border-radius:16px;padding:14px;z-index:9100;display:none;box-shadow:0 12px 40px #0009,0 0 0 1px var(--bd);animation:pop .15s ease}
#qs .qh{display:flex;gap:12px;align-items:center;margin-bottom:12px}#qs small{color:var(--mut)}#qs label{display:flex;gap:10px;align-items:center;margin:10px 0}
#qs .qb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.av{width:42px;height:42px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}.av.big{width:96px;height:96px;font-size:42px}
#toasts{position:fixed;top:44px;left:50%;transform:translateX(-50%);z-index:9900;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--panel);backdrop-filter:blur(14px);padding:10px 18px;border-radius:14px;box-shadow:0 8px 28px #0008,0 0 0 1px var(--bd);display:flex;gap:10px;animation:pop .25s ease;transition:opacity .3s}.toast.out{opacity:0}
#modal{position:fixed;inset:0;background:#0007;z-index:9800;display:none;align-items:center;justify-content:center}
#modal .box{background:var(--win);padding:20px;border-radius:14px;min-width:320px;max-width:90vw;display:flex;flex-direction:column;gap:12px;box-shadow:0 16px 50px #000a,0 0 0 1px var(--bd);animation:pop .15s ease}
#modal .bt{display:flex;gap:8px;justify-content:flex-end}
#login{position:fixed;inset:0;z-index:9700;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000a;backdrop-filter:blur(30px);color:#fff;transition:opacity .35s}
#login.fade{opacity:0}
#login .lclock{position:absolute;top:8vh;text-align:center}.lt{font-size:72px;font-weight:300;letter-spacing:2px}.ld{font-size:18px;opacity:.8;text-transform:capitalize}
#login .lbox{display:flex;flex-direction:column;gap:12px;align-items:center;min-width:300px;margin-top:6vh}
#login .lbox input{width:300px;background:#ffffff1f;border:1px solid #ffffff44;color:#fff;text-align:center;padding:10px}#login .lbox input::placeholder{color:#ffffffaa}
#login .lbox button{color:#fff}#login .lbox button:not(.pri){background:#ffffff26}
.lusers{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:80vw}
.lu{text-align:center;cursor:pointer;padding:14px 18px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600}.lu:hover{background:#ffffff22}.lu small{font-weight:400;opacity:.7}
.lrow{display:flex;gap:8px}.lerr{color:#ff8a80;min-height:18px;font-size:13px;text-align:center}
.llink{cursor:pointer;opacity:.85;text-decoration:underline}
.lhint{position:absolute;bottom:7vh;background:#ffffff1f;padding:10px 16px;border-radius:12px;font-size:13px}
.lpow{position:absolute;right:24px;bottom:24px}.lpow button{font-size:20px;background:#ffffff26;color:#fff}
.shake{animation:shake .35s}@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
#boot,#off{position:fixed;inset:0;background:#000;z-index:9990;font:13px/1.55 var(--mono);color:#ccc;padding:24px;overflow:hidden;white-space:pre}
#off{display:none;place-items:center;text-align:center;cursor:pointer;font:16px system-ui;white-space:normal}
#boot{z-index:9999}
</style>
</head>
<body class="out">
<div id="desktop"></div><div id="dim"></div>
<div id="top">
  <div class="l"><span class="act" id="actBtn">Activités</span><span id="appname"></span></div>
  <div class="c" id="clock"></div>
  <div class="r" id="tray"><span id="net">📶</span><span id="vol">🔊</span><span id="bat">🔋</span><span id="usr"></span></div>
</div>
<div id="dock"></div>
<div id="icons"></div>
<div id="launcher"><div class="lw"><input id="ls" placeholder="Rechercher une application…" autocomplete="off"><div class="grid"></div></div></div>
<div id="qs"></div>
<div id="ctx"></div>
<div id="toasts"></div>
<div id="modal"><div class="box"><div id="mt"></div><input id="mi"><div class="bt"><button id="mc">Annuler</button><button id="mo" class="pri">OK</button></div></div></div>
<div id="login"></div>
<div id="off"><div><div style="font-size:60px">⏻</div><p style="margin-top:10px">Système éteint.<br>Clique pour redémarrer.</p></div></div>
<div id="boot"></div>

<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const ssGet=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},ssSet=(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}};
let bootTime=Date.now(),cur=null;

/* ---------- Utilisateurs & mots de passe ---------- */
let users={};try{users=JSON.parse(lsGet('wl2users'))||{}}catch(e){}
const fbHash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return 'x:'+h.toString(16)};
async function hashPw(pw,salt){const s=salt+':'+pw;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return fbHash(s)}}
async function checkPw(name,pw){const u=users[name];if(!u)return false;if(u.h.startsWith('x:'))return u.h===fbHash(u.salt+':'+pw);return (await hashPw(pw,u.salt))===u.h}
const rnd=()=>Math.random().toString(36).slice(2,10);
const isAdmin=u=>u==='root'||!!(users[u]&&users[u].role==='admin');
const homeP=u=>u==='root'?['root']:['home',u];
const saveUsers=()=>{lsSet('wl2users',JSON.stringify(users));syncSys()};
async function mkUser(name,pw,role){const salt=rnd();users[name]={h:await hashPw(pw,salt),salt,role:role||'user',created:Date.now(),last:null};ensureHome(name);saveUsers()}
async function setPw(name,pw){const salt=rnd();users[name].salt=salt;users[name].h=await hashPw(pw,salt);delete users[name].def;saveUsers()}

/* ---------- Système de fichiers ---------- */
const D=c=>({t:'d',c:c||{}}),F=s=>({t:'f',s:s||''});
const homeFiles=n=>D({Bureau:D(),Documents:D(),Téléchargements:D(),Images:D(),'bonjour.txt':F(`Salut ${n} ! Ce système tourne entièrement dans ton navigateur.\nEssaie : ls, cd, cat, mkdir, neofetch, tree, cowsay...\nLes administrateurs peuvent utiliser sudo (tape help).\n`)});
function defaultFS(){return D({home:D({}),
 etc:D({hostname:F('weblinux\n'),'os-release':F('NAME="WebLinux"\nVERSION="2.0"\nPRETTY_NAME="WebLinux 2.0"\n'),passwd:F(),shadow:F()}),
 usr:D({bin:D(),lib:D()}),var:D({log:D({syslog:F('Boot OK\nSystemd: tous les services sont démarrés\n'),'auth.log':F()})}),
 tmp:D(),bin:D({ls:F('\x7fELF'),cat:F('\x7fELF'),bash:F('\x7fELF')}),
 root:D({'secret.txt':F('Bravo, tu es root ! 🎉\nAvec de grands pouvoirs viennent de grandes responsabilités.\n'),'.bash_history':F()})})}
let fs=null;try{fs=JSON.parse(lsGet('wl2fs'))}catch(e){}
if(!fs||fs.t!=='d'||!fs.c.home||!fs.c.var)fs=defaultFS();
const saveFS=()=>lsSet('wl2fs',JSON.stringify(fs));
function ensureHome(n){if(!fs.c.home)fs.c.home=D();if(!fs.c.home.c[n])fs.c.home.c[n]=homeFiles(n);saveFS()}
function syncSys(){const e=fs.c.etc;if(!e||e.t!=='d')return;let p='root:x:0:0:root:/root:/bin/bash\n',s='root:*:\n',i=1000;for(const n in users){const id=i++;p+=`${n}:x:${id}:${id}:${n}:/home/${n}:/bin/bash\n`;s+=`${n}:${users[n].h.slice(0,43)}:\n`}e.c.passwd=F(p);e.c.shadow=F(s);saveFS()}
const norm=(p,cwd,hp)=>{if(p==='~'||p.startsWith('~/'))p='/'+hp.join('/')+p.slice(1);const parts=p.startsWith('/')?[]:[...cwd];for(const s of p.split('/')){if(!s||s==='.')continue;if(s==='..')parts.pop();else parts.push(s)}return parts};
const get=parts=>{let n=fs;for(const s of parts){if(!n||n.t!=='d'||!Object.prototype.hasOwnProperty.call(n.c,s))return null;n=n.c[s]}return n};
const pstr=parts=>'/'+parts.join('/');
const sortNames=n=>Object.keys(n.c).sort((a,b)=>(n.c[a].t===n.c[b].t?a.localeCompare(b,'fr'):n.c[a].t==='d'?-1:1));
function canDo(u,p,w){if(u==='root')return true;const s=pstr(p);
 if(s==='/root'||s.startsWith('/root/')||s==='/etc/shadow'||s==='/var/log/auth.log')return false;
 const m=s.match(/^\/home\/([^\/]+)/);if(m&&m[1]!==u)return false;
 if(!w)return true;return s==='/tmp'||s.startsWith('/tmp/')||s.startsWith('/home/'+u+'/')}
const owner=p=>p[0]==='root'?'root':(p[0]==='home'&&p[1])?p[1]:'root';
function logEvent(proc,msg){try{const d=fs.c.var.c.log;const t=new Date().toISOString().replace('T',' ').slice(0,19);const l=(d.c['auth.log']?d.c['auth.log'].s:'').split('\n').filter(Boolean);l.push(`${t} weblinux ${proc}: ${msg}`);d.c['auth.log']=F(l.slice(-300).join('\n')+'\n');saveFS()}catch(e){}}
function downloadBackup(){const b=new Blob([JSON.stringify({v:2,fs,users},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='weblinux-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function countFiles(n){return n.t==='f'?1:Object.values(n.c).reduce((s,x)=>s+countFiles(x),0)}

/* ---------- Services (simulés) ---------- */
const SVC={ssh:{d:'Serveur SSH',on:true},cron:{d:'Tâches planifiées',on:true},network:{d:'Réseau',on:true},firewall:{d:'Pare-feu (ufw)',on:false},'weblinux-wm':{d:'Gestionnaire de fenêtres',on:true}};
const netIcon=()=>{$('#net').textContent=SVC.network.on?'📶':'⛔'};

/* ---------- Réglages par utilisateur ---------- */
const WPS=['linear-gradient(135deg,#77216f,#2c001e 55%,#e95420 140%)','linear-gradient(160deg,#0f2027,#203a43,#2c5364)','linear-gradient(135deg,#232526,#414345)','linear-gradient(135deg,#134e5e,#71b280)','linear-gradient(135deg,#42275a,#734b6d)','radial-gradient(circle at 30% 20%,#3a1c71,#d76d77 60%,#ffaf7b)','linear-gradient(135deg,#000428,#004e92)','#1a1a1a'];
const ACS=['#e95420','#3584e4','#2ec27e','#9141ac','#e5a50a','#e01b24'];
const defSet={th:'dark',ac:'#e95420',wp:0,vol:60,br:100};let S={...defSet};
function applyS(){document.documentElement.dataset.theme=S.th;document.documentElement.style.setProperty('--ac',S.ac);$('#desktop').style.background=WPS[S.wp]||WPS[0];$('#desktop').style.backgroundSize='cover';$('#dim').style.opacity=(100-S.br)/100*.6;$('#vol').textContent=S.vol==0?'🔇':'🔊'}
const loadS=u=>{let o={};try{o=JSON.parse(lsGet('wl2set_'+u))||{}}catch(e){}S={...defSet,...o};applyS()};
const saveS=()=>{if(cur)lsSet('wl2set_'+cur,JSON.stringify(S))};

/* ---------- Notifications & modale ---------- */

 const done=v=>{m.style.display='none';$('#mo').onclick=$('#mc').onclick=i.onkeydown=null;if(v!=null&&(v!==''||type==='confirm'))cb(v)};

/* ---------- Fenêtres ---------- */
let zTop=100,wins=[],pidN=1000;
function win(title,icon,body,o={}){
 const w=Math.min(o.w||640,innerWidth-20),h=Math.min(o.h||420,innerHeight-60);
 const el=document.createElement('div');el.className='win';
 el.style.cssText=`width:${w}px;height:${h}px;left:${o.x??Math.max(90,100+wins.length*28)}px;top:${o.y??Math.max(44,60+wins.length*28)}px`;
 el.innerHTML=`<div class="tb"><span class="ti"></span><span class="wb"><b class="min" title="Réduire">–</b><b class="max" title="Agrandir">▢</b><b class="cls" title="Fermer">✕</b></span></div><div class="bd"></div>`;
 $('.bd',el).appendChild(body);document.body.appendChild(el);
 const W={el,icon,title,pid:++pidN,hidden:false,onclose:o.onclose,
  setTitle(t){W.title=t;$('.ti',el).textContent=icon+' '+t;renderDock()},
  focus(){wins.forEach(x=>x.el.classList.remove('foc'));if(W.hidden){W.hidden=false;el.style.display='flex'}el.classList.add('foc');el.style.zIndex=++zTop;renderDock()},
  close(){W.onclose&&W.onclose();el.remove();wins=wins.filter(x=>x!==W);renderDock()},
  hide(){W.hidden=true;el.style.display='none';el.classList.remove('foc');renderDock()}};
 W.setTitle(title);wins.push(W);
 el.addEventListener('pointerdown',()=>{if(!el.classList.contains('foc'))W.focus()});
 $('.cls',el).onclick=()=>W.close();$('.min',el).onclick=()=>W.hide();
 const mx=()=>el.classList.toggle('max');$('.max',el).onclick=mx;
 const tb=$('.tb',el);tb.ondblclick=e=>{if(!e.target.closest('.wb'))mx()};
 tb.addEventListener('pointerdown',e=>{if(e.target.closest('.wb')||el.classList.contains('max'))return;
  const sx=e.clientX-el.offsetLeft,sy=e.clientY-el.offsetTop;tb.setPointerCapture(e.pointerId);
  const mv=ev=>{el.style.left=Math.max(-el.offsetWidth+80,Math.min(innerWidth-80,ev.clientX-sx))+'px';el.style.top=Math.max(32,Math.min(innerHeight-40,ev.clientY-sy))+'px'};
  const up=ev=>{tb.removeEventListener('pointermove',mv);tb.removeEventListener('pointerup',up);
   if(ev.clientX<10){el.style.left='0';el.style.top='32px';el.style.width='50vw';el.style.height='calc(100vh - 32px)'}
   else if(ev.clientX>innerWidth-10){el.style.left='50vw';el.style.top='32px';el.style.width='50vw';el.style.height='calc(100vh - 32px)'}
   else if(ev.clientY<6)el.classList.add('max')};
  tb.addEventListener('pointermove',mv);tb.addEventListener('pointerup',up)});
 W.focus();return W;
}

/* ---------- Calculatrice ---------- */
function openCalc(){
 let c='0',acc=null,op=null,fresh=true;const body=document.createElement('div');body.className='calc';
 body.innerHTML=`<div class="scr"><small></small><div></div></div><div class="keys">${['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(k=>`<button class="${'÷×−+='.includes(k)?'op':''}">${k}</button>`).join('')}</div>`;
 const fmt=n=>isFinite(n)?String(+n.toPrecision(12)):'Erreur',calc=(a,b,o)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:b===0?NaN:a/b;
 const show=()=>{$('.scr div',body).textContent=c;$('.scr small',body).textContent=op?`${fmt(acc)} ${op}`:''};
 body.onclick=e=>{if(e.target.tagName!=='BUTTON')return;const k=e.target.textContent;
  if(/\d/.test(k)){c=fresh||c==='0'?k:c+k;fresh=false}
  else if(k==='.'){if(fresh){c='0.';fresh=false}else if(!c.includes('.'))c+='.'}
  else if('÷×−+'.includes(k)){if(op&&!fresh){acc=calc(acc,+c,op);c=fmt(acc)}else acc=+c;op=k;fresh=true}
  else if(k==='='){if(op){c=fmt(calc(acc,+c,op));op=null;acc=null;fresh=true}}
  else if(k==='C'){c='0';acc=null;op=null;fresh=true}
  else if(k==='±')c=fmt(-+c);else if(k==='%')c=fmt(+c/100);else if(k==='⌫')c=c.length>1?c.slice(0,-1):'0';
  show()};
 show();return win('Calculatrice','🧮',body,{w:300,h:430});
}

  cx.clearRect(0,0,600,140);cx.strokeStyle='#8884';for(let y=0;y<=140;y+=35){cx.beginPath();cx.moveTo(0,y);cx.lineTo(600,y);cx.stroke()}

  $('tbody',body).innerHTML=rows.join('')};
 body.onclick=e=>{const k=e.target.dataset.k;if(k){const w=wins.find(x=>x.pid==k);w&&w.close()}};
 tick();const iv=setInterval(tick,1000);

  open(a,x){const p=a[0]?nm(a[0]):cwd;if(!get(p))return x.o(err(`${a[0]} : introuvable`));if(!ok(p,false))return x.o(err('Permission non accordée'));const real=eu;if(real==='root'&&cur!=='root'){/* l'interface graphique utilise la session */}openPath(p)},
  nano(a,x){if(!a[0])return x.o('Usage : nano FICHIER');const p=nm(a[0]);if(get(p)&&!ok(p,false))return x.o(err('Permission non accordée'));openEditor(pstr(p))},

  /* --- administration --- */
  async sudo(a,x){
   if(!a.length)return x.o('usage : sudo [-i] COMMANDE');
   if(eu!=='root'){
    if(!isAdmin(eu)){logEvent('sudo',`${eu} : refusé (pas dans sudoers)`);return x.o(`${esc(eu)} n'est pas dans le fichier sudoers. Cet incident sera signalé.`)}
    if(Date.now()>sudoUntil){for(let t=0;t<3;t++){const pw=await readPass(`[sudo] mot de passe de ${eu} : `);if(await checkPw(eu,pw)){sudoUntil=Date.now()+300000;break}
      if(t===2){logEvent('sudo',`${eu} : 3 échecs de mot de passe`);return x.o(err('sudo : 3 tentatives de mot de passe incorrectes'))}print('Désolé, essayez de nouveau.')}}
    logEvent('sudo',`${eu} : ${a.join(' ')}`);
   }
   if(a[0]==='-i'){stack.push({eu,cwd:[...cwd]});eu='root';cwd=['root'];return}
   const old=eu;eu='root';try{await dispatch(a[0],a.slice(1),x)}finally{eu=old}},
  async su(a,x){const t=(a[0]==='-'?a[1]:a[0])||'root';
   if(t!=='root'&&!users[t])return x.o(err(`su : l'utilisateur ${t} n'existe pas`));
   if(eu!=='root'){
    if(t==='root'&&!isAdmin(eu))return x.o(err(`su : Échec d'authentification (réservé aux administrateurs)`));
    const pw=await readPass(t==='root'?`Mot de passe (${eu}) : `:'Mot de passe : ');
    if(!(await checkPw(t==='root'?eu:t,pw))){logEvent('su',`échec ${eu} -> ${t}`);return x.o(err(`su : Échec d'authentification`))}}
   logEvent('su',`${eu} -> ${t}`);stack.push({eu,cwd:[...cwd]});eu=t;cwd=[...homeP(t)]},
  async useradd(a,x){if(!need(x,'useradd'))return;const adm=a.includes('-a'),n=a.filter(s=>s[0]!=='-')[0];
   if(!n)return x.o('usage : useradd [-a] NOM');if(!/^[a-z][a-z0-9_-]{1,15}$/.test(n))return x.o(err('useradd : nom invalide (a-z, 0-9, _ -, 2 à 16 caractères)'));
   if(users[n]||n==='root')return x.o(err(`useradd : l'utilisateur '${n}' existe déjà`));
   const p1=await readPass('Mot de passe du nouvel utilisateur : ');if(p1.length<4)return x.o(err('useradd : mot de passe trop court (4 minimum)'));
   await mkUser(n,p1,adm?'admin':'user');logEvent('useradd',`${cur} a créé ${n} (${adm?'admin':'user'})`);x.o(`utilisateur '${esc(n)}' créé${adm?' (administrateur)':''}`)},
  userdel(a,x){if(!need(x,'userdel'))return;const rm=a.includes('-r'),n=a.filter(s=>s[0]!=='-')[0];
   if(!users[n])return x.o(err(`userdel : l'utilisateur '${n||''}' n'existe pas`));if(n===cur)return x.o(err('userdel : impossible de supprimer la session ouverte'));
   if(users[n].role==='admin'&&Object.values(users).filter(u=>u.role==='admin').length<2)return x.o(err('userdel : dernier administrateur'));
   delete users[n];if(rm)delete fs.c.home.c[n];saveUsers();logEvent('userdel',`${cur} a supprimé ${n}${rm?' (avec son dossier)':''}`);x.o(`utilisateur '${esc(n)}' supprimé`)},
  async passwd(a,x){const t=a[0]||(eu==='root'?cur:eu);if(!users[t])return x.o(err(`passwd : utilisateur '${t}' inconnu`));
   if(t!==eu&&eu!=='root')return x.o(err('passwd : Permission non accordée'));
   if(eu!=='root'){const o=await readPass('Mot de passe actuel : ');if(!(await checkPw(t,o)))return x.o(err('passwd : Mot de passe incorrect'))}
   const p1=await readPass('Nouveau mot de passe : ');if(p1.length<4)return x.o(err('passwd : 4 caractères minimum'));
   const p2=await readPass('Confirmer : ');if(p1!==p2)return x.o(err('passwd : Les mots de passe ne correspondent pas'));
   await setPw(t,p1);logEvent('passwd',`mot de passe de ${t} modifié par ${eu}`);x.o('passwd : mot de passe mis à jour')},
  usermod(a,x){if(!need(x,'usermod'))return;const n=a.filter(s=>s[0]!=='-')[0],up=a.includes('-a'),down=a.includes('-u');
   if(!users[n]||(!up&&!down))return x.o('usage : usermod -a|-u NOM  (-a = administrateur, -u = utilisateur)');
   if(down&&users[n].role==='admin'&&Object.values(users).filter(u=>u.role==='admin').length<2)return x.o(err('usermod : dernier administrateur'));
   users[n].role=up?'admin':'user';saveUsers();logEvent('usermod',`${cur} a mis ${n} en ${users[n].role}`);x.o(`${esc(n)} est maintenant ${up?'administrateur':'utilisateur'}`)},
  users(a,x){x.o(Object.keys(users).map(n=>`${esc(n)}${isAdmin(n)?' <span class="y">(admin)</span>':''}${n===cur?' <span class="g">● connecté</span>':''}`).join('\n'))},
  who(a,x){x.o(`${esc(cur)}   pts/0   ${new Date().toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}`)},
  last(a,x){const l=authLines().filter(s=>/login: session ouverte/.test(s)).slice(-10).reverse();x.o(l.length?l.map(s=>{const m=s.match(/^(\S+ \S+) .*pour (\S+)/);return m?`${esc(m[2]).padEnd(12)}pts/0   ${m[1]}`:''}).join('\n'):'(aucune connexion enregistrée)')},
  journalctl(a,x){if(!need(x,'journalctl'))return;const i=a.indexOf('-n'),n=i>=0?+a[i+1]||20:30,l=authLines().slice(-n);x.o(l.length?l.map(esc).join('\n'):'-- Pas d\'entrées --')},
  async systemctl(a,x){const sub=a[0]||'list',n=a[1];
   if(sub==='list'||sub==='list-units'){x.o('UNITÉ                 ÉTAT');for(const k in SVC)x.o(k.padEnd(22)+(SVC[k].on?'<span class="g">actif</span>  ':'<span class="r">inactif</span>')+' '+esc(SVC[k].d));return}
   if(!n||!SVC[n])return x.o(err(`systemctl : unité '${n||''}' introuvable`));
   if(sub==='status')return x.o(`● ${n} - ${esc(SVC[n].d)}\n   Actif : ${SVC[n].on?'<span class="g">actif (en cours d\'exécution)</span>':'<span class="r">inactif (arrêté)</span>'}`);
   if(!need(x,'systemctl'))return;
   if(sub==='stop'&&n==='weblinux-wm')return x.o(err(`systemctl : impossible d'arrêter weblinux-wm (le bureau en dépend)`));
   if(sub==='stop')SVC[n].on=false;else if(sub==='start'||sub==='restart')SVC[n].on=true;else return x.o(err('systemctl : action inconnue (status, start, stop, restart)'));
   logEvent('systemctl',`${cur} : ${sub} ${n}`);netIcon();x.o(`${n} : ${sub} effectué`)},
  kill(a,x){const pid=+a.filter(s=>s[0]!=='-')[0];if(!pid)return x.o('usage : kill PID');const w=wins.find(w=>w.pid===pid);if(!w)return x.o(err(`kill : (${pid}) - Aucun processus de ce type`));x.o(`processus ${pid} terminé`);w.close()},
  killall(a,x){const n=(a[0]||'').toLowerCase();if(!n)return x.o('usage : killall NOM');const l=wins.filter(w=>w.title.toLowerCase().includes(n)&&w!==W);if(!l.length)return x.o(err(`killall : aucun processus nommé '${a[0]}'`));l.forEach(w=>w.close());x.o(`${l.length} processus terminé(s)`)},
  wall(a,x){if(!need(x,'wall'))return;if(!a.length)return x.o('usage : wall MESSAGE');toast(a.join(' '),'📢');logEvent('wall',`${cur} : ${a.join(' ')}`);x.o('Message diffusé.')},
  backup(a,x){if(!need(x,'backup'))return;downloadBackup();x.o('Sauvegarde téléchargée (weblinux-backup.json).')},
  lock(a,x){x.o('Verrouillage...');setTimeout(lockScreen,200)},
  logout(a,x){x.o('Déconnexion...');setTimeout(logout,200)},
  reboot(a,x){if(!need(x,'reboot'))return;logEvent('system',`redémarrage par ${cur}`);x.o('Redémarrage...');setTimeout(()=>boot(true),500)},
  shutdown(a,x){if(!need(x,'shutdown'))return;logEvent('system',`extinction par ${cur}`);x.o('Extinction...');setTimeout(poweroff,500)},
  exit(a,x){if(stack.length){const s=stack.pop();eu=s.eu;cwd=s.cwd;sudoUntil=0}else W.close()}
 };
 C.vim=C.edit=C.nano;C.poweroff=C.shutdown;C.adduser=C.useradd;C.deluser=C.userdel;C.logout=C.logout;
 async function dispatch(name,a,x){if(name==='ll'){name='ls';a=['-l',...a]}const f=C[name];if(f&&name[0]!=='_')await f(a,x);else x.o(err(`bash : ${name} : commande introuvable (essaie 'help')`))}
 async function exec(seg,input,last){
  const buf=[];let red=null;seg=seg.trim();
  const m=seg.match(/^(.*?)\s*(>>|>)\s*(\S+)\s*$/);if(m&&last){seg=m[1];red={app:m[2]==='>>',f:m[3]}}
  const a=split(expand(seg));if(!a.length)return '';const name=a.shift(),x={in:input,o:h=>buf.push(h)};
  await dispatch(name,a,x);
  if(red){const t=plain(buf.join('\n')),p=nm(red.f),par=get(p.slice(0,-1)),n=p[p.length-1];
   if(!par||par.t!=='d'||(par.c[n]&&par.c[n].t==='d'))print(err(`bash : ${red.f} : impossible d'écrire`));
   else if(!ok(p,true))print(err(`bash : ${red.f} : Permission non accordée`));
   else{par.c[n]=F((red.app&&par.c[n]?par.c[n].s:'')+t+'\n');saveFS()}return ''}
  return buf.join('\n');
 }
 async function run(line){
  print(promptHTML()+esc(line));if(!line.trim())return;hist.push(line);hi=hist.length;busy=true;
  try{for(const part of line.split(/\s*(?:&&|;)\s*/)){if(!part.trim())continue;const segs=part.split('|');let input=null,res='';for(let i=0;i<segs.length;i++){res=await exec(segs[i],input,i===segs.length-1);input=plain(res)}if(res)print(res)}}catch(e){print(err('Erreur : '+e.message))}
  busy=false;if(document.body.contains(term))setPrompt();scroll();
 }
 function complete(){
  const v=inp.value,parts=v.split(' '),w=parts[parts.length-1];let cands=[];
  if(parts.length===1)cands=CMDS.filter(c=>c.startsWith(w));
  else{const i=w.lastIndexOf('/'),dir=i>=0?w.slice(0,i+1):'',base=w.slice(i+1),p=nm(dir||'.'),n=get(p);
   if(n&&n.t==='d'&&ok(p,false))cands=Object.keys(n.c).filter(k=>k.startsWith(base)).map(k=>dir+k+(n.c[k].t==='d'?'/':''))}
  if(cands.length===1){parts[parts.length-1]=cands[0];inp.value=parts.join(' ')+(cands[0].endsWith('/')?'':' ')}
  else if(cands.length>1){print(promptHTML()+esc(v));print(cands.map(esc).join('  '));let p=cands[0];for(const c of cands)while(!c.startsWith(p))p=p.slice(0,-1);parts[parts.length-1]=p;inp.value=parts.join(' ')}
 }
 inp.onkeydown=e=>{
  if(e.key==='Enter'){if(passRes){const f=passRes;passRes=null;const v=inp.value;inp.value='';f(v);return}if(busy)return;const l=inp.value;inp.value='';run(l)}
  else if(passRes)return;
  else if(e.key==='ArrowUp'){e.preventDefault();if(hi>0)inp.value=hist[--hi]}
  else if(e.key==='ArrowDown'){e.preventDefault();inp.value=hi<hist.length-1?hist[++hi]:(hi=hist.length,'')}
  else if(e.key==='Tab'){e.preventDefault();complete()}
  else if(e.ctrlKey&&e.key==='l'){e.preventDefault();out.innerHTML=''}
  else if(e.ctrlKey&&e.key==='c'){e.preventDefault();print(promptHTML()+esc(inp.value)+'^C');inp.value=''}
 };
 term.onclick=()=>{if(!getSelection().toString())inp.focus()};
 W.el.addEventListener('pointerdown',()=>setTimeout(()=>{if(!getSelection().toString())inp.focus()},0));
 setPrompt();
 print(`<span class="y">Bienvenue sur WebLinux 2.0</span>, <b>${esc(cur)}</b> (${isAdmin(cur)?'administrateur : utilise <span class="c">sudo</span> pour les commandes admin':'utilisateur'}).\nTape <span class="c">help</span> pour voir les commandes.\n`);
 setTimeout(()=>inp.focus(),50);return W;
}

/* ---------- Bureau, menu contextuel, horloge ---------- */
function renderIcons(){if(!cur)return;const hp=pstr(homeP(cur));
 const L=[{i:'🏠',n:'Dossier personnel',f:()=>openFiles()},{i:'📄',n:'bonjour.txt',f:()=>openEditor(hp+'/bonjour.txt')},{i:'🖥️',n:'Terminal',f:()=>openTerminal()}];
 $('#icons').innerHTML=L.map((d,i)=>`<div class="dico" data-i="${i}"><i>${d.i}</i>${d.n}</div>`).join('');
 $('#icons').ondblclick=e=>{const d=e.target.closest('.dico');if(d)L[d.dataset.i].f()};
 $('#usr').textContent='👤 '+cur}
const ctx=$('#ctx');
document.addEventListener('contextmenu',e=>{if(!cur||e.target.closest('.win')||e.target.closest('#top')||e.target.closest('#login'))return;e.preventDefault();
 ctx.innerHTML='<div data-a="t">🖥️ Ouvrir un terminal</div><div data-a="f">📁 Ouvrir les fichiers</div><div data-a="s">🎨 Apparence…</div><div data-a="l">🔒 Verrouiller</div>';
 ctx.style.left=Math.min(e.clientX,innerWidth-230)+'px';ctx.style.top=Math.min(e.clientY,innerHeight-170)+'px';ctx.style.display='block'});
ctx.onclick=e=>{const a=e.target.dataset.a;if(a==='t')openTerminal();if(a==='f')openFiles();if(a==='s')openSettings();if(a==='l')lockScreen()};
document.addEventListener('click',e=>{ctx.style.display='none';if(!e.target.closest('#qs'))qs.style.display='none'});
document.addEventListener('keydown',e=>{if(cur&&e.ctrlKey&&e.altKey&&e.key.toLowerCase()==='t'){e.preventDefault();openTerminal()}if(e.key==='Escape'){LA.style.display='none';qs.style.display='none'}});
const loginClock=()=>`<div class="lt">${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</div><div class="ld">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div>`;
const clock=()=>{$('#clock').textContent=new Date().toLocaleString('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});const lc=$('.lclock');if(lc)lc.innerHTML=loginClock()};
clock();setInterval(clock,10000);
if(navigator.getBattery)navigator.getBattery().then(b=>{const u=()=>$('#bat').textContent='🔋 '+Math.round(b.level*100)+'%';u();b.onlevelchange=u}).catch(()=>{});

/* ---------- Connexion / verrouillage ---------- */
let lockedUntil=0,fails=0;
function finishLogin(name,o){
 if(cur&&cur!==name)wins.slice().forEach(w=>w.close());
 cur=name;ssSet('wl2sess',name);lsSet('wl2last',name);users[name].last=Date.now();saveUsers();
 logEvent('login',`session ouverte pour ${name}`);loadS(name);ensureHome(name);
 const L=$('#login');L.classList.add('fade');setTimeout(()=>{L.style.display='none';L.innerHTML=''},350);
 document.body.classList.remove('out');renderIcons();renderDock();
 if(!wins.length)openTerminal();
 toast(`Bienvenue, ${name} !`,'👋');
 if(users[name].def)setTimeout(()=>toast(`Pense à changer le mot de passe par défaut : tape « passwd »`,'⚠️'),1400);
}
function showLogin(o={}){
 const L=$('#login');L.style.display='flex';L.classList.remove('fade');document.body.classList.add('out');
 let sel=o.lock?cur:null,mode='pick';
 function draw(){
  const names=o.lock?[cur]:Object.keys(users);let h=`<div class="lclock">${loginClock()}</div><div class="lbox">`;
  if(mode==='reg')h+=`<h2>Créer un compte</h2><input id="rn" placeholder="Nom d'utilisateur" maxlength="16" autocomplete="off"><input id="rp" type="password" placeholder="Mot de passe (4 min.)"><input id="rp2" type="password" placeholder="Confirmer"><div class="lerr"></div><div class="lrow"><button id="rb">Retour</button><button class="pri" id="rok">Créer</button></div>`;
  else if(!sel)h+=`<h2>Qui es-tu ?</h2><div class="lusers">${names.map(n=>`<div class="lu" data-n="${esc(n)}"><div class="av big">${esc(n[0].toUpperCase())}</div>${esc(n)}<small>${users[n].role==='admin'?'administrateur':'utilisateur'}</small></div>`).join('')}</div><a class="llink" id="rg">＋ Créer un compte</a>`;
  else h+=`<div class="av big">${esc(sel[0].toUpperCase())}</div><h2>${esc(sel)}</h2><input id="lp" type="password" placeholder="Mot de passe" autocomplete="current-password"><div class="lerr"></div><div class="lrow"><button id="lb">${o.lock?'Changer d\'utilisateur':'Retour'}</button><button class="pri" id="lok">Se connecter</button></div>`;
  h+='</div>';
  if(!sel&&mode!=='reg'&&users.admin&&users.admin.def)h+=`<div class="lhint">💡 Compte administrateur par défaut : <b>admin</b> / <b>admin</b></div>`;
  h+=`<div class="lpow"><button id="lsd" title="Éteindre">⏻</button></div>`;
  L.innerHTML=h;
  $$('.lu',L).forEach(e=>e.onclick=()=>{sel=e.dataset.n;draw()});
  const rg=$('#rg',L);if(rg)rg.onclick=()=>{mode='reg';draw()};
  $('#lsd',L).onclick=poweroff;
  const box=$('.lbox',L),shake=()=>{box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake')};
  const lb=$('#lb',L);if(lb)lb.onclick=()=>{if(o.lock)return logout();sel=null;draw()};
  const lok=$('#lok',L),lp=$('#lp',L);
  if(lok){const go=async()=>{const er=$('.lerr',L),now=Date.now();if(lockedUntil>now){er.textContent=`Trop d'essais. Réessaie dans ${Math.ceil((lockedUntil-now)/1000)} s.`;return}
    if(await checkPw(sel,lp.value)){fails=0;finishLogin(sel,o)}
    else{fails++;logEvent('login',`échec de connexion pour ${sel}`);if(fails>=3){lockedUntil=Date.now()+10000;fails=0;er.textContent='3 échecs : attends 10 secondes.'}else er.textContent='Mot de passe incorrect.';lp.value='';shake()}};
   lok.onclick=go;lp.onkeydown=e=>{if(e.key==='Enter')go()};lp.focus()}
  const rok=$('#rok',L);
  if(rok){const rb=$('#rb',L);rb.onclick=()=>{mode='pick';draw()};
   const reg=async()=>{const n=$('#rn',L).value.trim().toLowerCase(),p=$('#rp',L).value,p2=$('#rp2',L).value,er=$('.lerr',L);
    if(!/^[a-z][a-z0-9_-]{1,15}$/.test(n))return er.textContent='Nom invalide (minuscules, chiffres, _ -, 2 à 16).';
    if(users[n]||n==='root')return er.textContent='Ce nom est déjà pris.';if(p.length<4)return er.textContent='Mot de passe : 4 caractères minimum.';if(p!==p2)return er.textContent='Les mots de passe ne correspondent pas.';
    await mkUser(n,p,'user');logEvent('useradd',`compte ${n} créé depuis l'écran de connexion`);toast('Compte créé, connecte-toi !','✅');mode='pick';sel=n;draw()};
   rok.onclick=reg;$('#rp2',L).onkeydown=e=>{if(e.key==='Enter')reg()};$('#rn',L).focus()}
 }
 draw();
}
function lockScreen(){if(!cur)return;logEvent('login',`écran verrouillé pour ${cur}`);qs.style.display='none';showLogin({lock:true})}
function logout(){if(cur)logEvent('login',`session fermée pour ${cur}`);wins.slice().forEach(w=>w.close());ssSet('wl2sess',null);cur=null;qs.style.display='none';LA.style.display='none';loadS(lsGet('wl2last')||'');showLogin()}
function poweroff(){if(cur)logEvent('system',`extinction (${cur})`);wins.slice().forEach(w=>w.close());ssSet('wl2sess',null);cur=null;qs.style.display='none';$('#login').style.display='none';$('#off').style.display='grid'}
$('#off').onclick=()=>{$('#off').style.display='none';boot(true)};

/* ---------- Démarrage ---------- */
const ready=(async()=>{if(!Object.keys(users).length){await mkUser('admin','admin','admin');users.admin.def=true;saveUsers()}else syncSys()})();
function boot(fresh){
 wins.slice().forEach(w=>w.close());bootTime=Date.now();if(fresh){ssSet('wl2sess',null);cur=null}
 document.body.classList.add('out');$('#login').style.display='none';qs.style.display='none';LA.style.display='none';
 const b=$('#boot');b.style.display='block';b.style.opacity=1;b.style.transition='';b.innerHTML='';
 const ok='[  <span style="color:#8ae234">OK</span>  ] ';
 const L=[ok+'Démarrage du noyau Linux 6.8.0-web',ok+'Monté le système de fichiers racine',ok+'Démarré systemd-journald',ok+'Atteint la cible Réseau',ok+'Démarré le gestionnaire de comptes',ok+'Atteint la cible Interface graphique','','WebLinux 2.0 — prêt.'];
 let i=0,done=false;
 const fin=async()=>{if(done)return;done=true;await ready;b.style.transition='opacity .5s';b.style.opacity=0;
  setTimeout(()=>{b.style.display='none';const s=ssGet('wl2sess');
   if(s&&users[s]){cur=s;loadS(s);document.body.classList.remove('out');renderIcons();renderDock();openTerminal()}
   else{loadS(lsGet('wl2last')||'');showLogin()}},500)};
 const step=()=>{if(done)return;if(i<L.length){b.innerHTML+=L[i++]+'\n';setTimeout(step,150)}else setTimeout(fin,300)};
 b.onclick=fin;step();
}
netIcon();applyS();renderDock();boot();
